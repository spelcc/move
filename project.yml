name: Move
options:
  bundleIdPrefix: cc.spel
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.2"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGNING_ALLOWED: NO
packages:
  MoveCore:
    path: .
targets:
  Move:
    type: application
    platform: macOS
    sources:
      - Sources/MoveMac
    dependencies:
      - package: MoveCore
        product: MoveCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.spel.move
        PRODUCT_NAME: Move
        INFOPLIST_FILE: Sources/MoveMac/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/MoveMac/Move.entitlements
