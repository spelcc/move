name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: move-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos-26:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select newest stable Xcode 26
        shell: bash
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' ! -name '*beta*' | sort -V | tail -1)
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Developer/Xcode/DerivedData
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Test core
        run: swift test --parallel
      - name: Build macOS 26 app
        run: xcodebuild -project Move.xcodeproj -scheme Move -configuration Release -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO clean build
      - name: Build iOS app and tests
        run: xcodebuild -project Move.xcodeproj -scheme MoveiOS -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build watchOS app and tests
        run: xcodebuild -project Move.xcodeproj -scheme MoveWatch -configuration Debug -destination 'generic/platform=watchOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build Widget extension
        run: xcodebuild -project Move.xcodeproj -scheme MoveWidgets -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Run macOS UI tests
        run: xcodebuild -project Move.xcodeproj -scheme Move -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test
      - name: Package unsigned app
        shell: bash
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path '*/Build/Products/Release/Move.app' -print -quit)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" Move-unsigned.zip
          test -s Move-unsigned.zip
          test "$(stat -f%z Move-unsigned.zip)" -lt 104857600
      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: Move-unsigned
          path: Move-unsigned.zip
      - name: Create unsigned DMG for release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path '*/Build/Products/Release/Move.app' -print -quit)
          test -n "$APP_PATH"
          hdiutil create -volname Move -srcfolder "$APP_PATH" -ov -format UDZO Move.dmg
          test -s Move.dmg
      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: Move-${{ github.ref_name }}
          path: |
            Move-unsigned.zip
            Move.dmg
